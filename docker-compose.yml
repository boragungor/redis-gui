services:
  redis-gui:
    build:
      context: .
      args:
        NEXT_PUBLIC_AZURE_AD_TENANT_ID: ${NEXT_PUBLIC_AZURE_AD_TENANT_ID}
        NEXT_PUBLIC_AZURE_AD_CLIENT_ID: ${NEXT_PUBLIC_AZURE_AD_CLIENT_ID}
        NEXT_PUBLIC_AZURE_AD_REDIRECT_URI: ${NEXT_PUBLIC_AZURE_AD_REDIRECT_URI:-http://localhost:3000}
        NEXT_PUBLIC_AZURE_AD_SCOPES: ${NEXT_PUBLIC_AZURE_AD_SCOPES:-User.Read openid profile email}
        NEXT_PUBLIC_ENABLE_MONGODB_LOGIN: ${NEXT_PUBLIC_ENABLE_MONGODB_LOGIN:-true}
        NEXT_PUBLIC_ENABLE_LOCAL_LOGIN: ${NEXT_PUBLIC_ENABLE_LOCAL_LOGIN:-false}
        NEXT_PUBLIC_REDIS_HOST: ${NEXT_PUBLIC_REDIS_HOST:-localhost}
        NEXT_PUBLIC_REDIS_PORT: ${NEXT_PUBLIC_REDIS_PORT:-6379}
        NEXT_PUBLIC_REDIS_DATABASE: ${NEXT_PUBLIC_REDIS_DATABASE:-0}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    ports:
      - "3000:3000"
    environment:
      - MONGODB_HOST=${MONGODB_HOST:-localhost}
      - MONGODB_PORT=${MONGODB_PORT:-27017}
      - MONGODB_USERNAME=${MONGODB_USERNAME}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD}
      - MONGODB_DATABASE=${MONGODB_DATABASE}
      - MONGODB_COLLECTION=${MONGODB_COLLECTION:-AdminUsers}
      - MONGODB_AUTH_SOURCE=${MONGODB_AUTH_SOURCE:-admin}
      # MongoDB TLS — validation is ON by default. Set MONGODB_TLS_CA_FILE for a
      # private CA; MONGODB_TLS_INSECURE=true disables validation (dev only).
      - MONGODB_TLS=${MONGODB_TLS:-true}
      - MONGODB_TLS_CA_FILE=${MONGODB_TLS_CA_FILE:-}
      - MONGODB_TLS_INSECURE=${MONGODB_TLS_INSECURE:-false}
      # Server-side secrets / Redis target (runtime only, never baked into image)
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
      # Trusted proxies in front of the app; only then is X-Forwarded-For
      # used for login rate limiting (0 = ignore the header).
      - TRUSTED_PROXY_COUNT=${TRUSTED_PROXY_COUNT:-0}
      # Authorization: empty = any authenticated user of that login method.
      - AUTH_REQUIRED_AZURE_ROLES=${AUTH_REQUIRED_AZURE_ROLES:-}
      - AUTH_REQUIRED_MONGO_ROLE_IDS=${AUTH_REQUIRED_MONGO_ROLE_IDS:-}
      - REDIS_HOST=${REDIS_HOST:-localhost}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DATABASE=${REDIS_DATABASE:-0}
      - REDIS_USERNAME=${REDIS_USERNAME:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_USE_TLS=${REDIS_USE_TLS:-false}
    restart: unless-stopped
